<div class="container">
  <header class="materials-top-bar">
    <h1 class="title">
      <i class="fas fa-boxes"></i>
      Matières Premières
    </h1>
    <button class="btn btn-primary" (click)="toggleForm()">
      <i class="fas" [ngClass]="showForm ? 'fa-times' : 'fa-plus'"></i>
      <span>{{ showForm ? 'Fermer' : 'Ajouter un Matériel' }}</span>
    </button>
  </header>

  <div class="form-card-modern mb-4" *ngIf="showForm">
    <h3 class="mb-3" style="font-size: 1.1rem; font-weight: 600; color: #2d3748;">
      {{ editingId ? 'Modifier la Matière' : 'Nouveau Matériel' }}
    </h3>
    <form (ngSubmit)="onSave()" class="row g-3">
      <div class="col-md-3">
        <input type="text" class="form-control-modern" placeholder="Désignation" [(ngModel)]="newMaterial.name" name="name" required>
      </div>
      <div class="col-md-2">
        <input type="number" class="form-control-modern" placeholder="Stock" [(ngModel)]="newMaterial.stock" name="stock" required>
      </div>
      <div class="col-md-2">
        <input type="number" class="form-control-modern" placeholder="Seuil Min" [(ngModel)]="newMaterial.stockMin" name="stockMin" required>
      </div>
      <div class="col-md-2">
        <input type="text" class="form-control-modern" placeholder="Unité" [(ngModel)]="newMaterial.unit" name="unit" required>
      </div>
      <div class="col-md-3 d-flex gap-2">
        <button type="submit" class="btn btn-primary flex-grow-1" style="justify-content: center;">
          <i class="fas fa-check"></i> {{ editingId ? 'Mettre à jour' : 'Enregistrer' }}
        </button>
        <button type="button" *ngIf="editingId" class="btn-icon" (click)="resetForm()" style="background: #e2e8f0;">
          <i class="fas fa-undo"></i>
        </button>
      </div>
    </form>
  </div>

  <div class="card">
    <table class="table">
      <thead>
      <tr>
        <th>ID</th>
        <th>Désignation</th>
        <th>État du Stock</th>
        <th>Unité</th>
        <th class="text-right">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let m of materials">
        <td><span class="order-number">#{{ m.id }}</span></td>
        <td><span class="supplier-name">{{ m.name }}</span></td>
        <td>
          <div class="stock-display">
              <span class="badge-stock" [ngClass]="m.stock <= m.stockMin ? 'danger' : 'success'">
                {{ m.stock }}
              </span>
            <span style="color: #a0aec0;">/ {{ m.stockMin }}</span>
            <i *ngIf="m.stock <= m.stockMin" class="fas fa-exclamation-triangle status-warning-icon"></i>
          </div>
        </td>
        <td><span class="unit-badge">{{ m.unit }}</span></td>
        <td class="text-right">
          <div class="actions">
            <button class="btn-icon btn-view" (click)="onEdit(m)"><i class="fas fa-pen"></i></button>
            <button class="btn-icon btn-danger" (click)="onDelete(m.id)"><i class="fas fa-trash"></i></button>
          </div>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <div class="stats-card" *ngIf="materials.length > 0">
    <div class="stat-item">
      <i class="fas fa-layer-group"></i>
      <span>{{ materials.length }} Matières</span>
    </div>
    <div class="stat-item">
      <i class="fas fa-exclamation-circle" style="color: #e53e3e;"></i>
      <span>Alertes: {{ getCriticalCount() }}</span>
    </div>
  </div>
</div>
