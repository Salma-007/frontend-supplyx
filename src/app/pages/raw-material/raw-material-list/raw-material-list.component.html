<div class="container mt-5">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <h3 class="mb-0">Gestion des Matières Premières</h3>
      <button class="btn btn-light btn-sm" (click)="toggleForm()">
        {{ showForm ? 'Fermer' : '+ Ajouter un Matérial' }}
      </button>
    </div>

    <div class="card-body border-bottom bg-light" *ngIf="showForm">
      <form (ngSubmit)="onSave()" class="row g-3">
        <div class="col-md-3">
          <input type="text" class="form-control" placeholder="Nom" [(ngModel)]="newMaterial.name" name="name" required>
        </div>
        <div class="col-md-2">
          <input type="number" class="form-control" placeholder="Stock" [(ngModel)]="newMaterial.stock" name="stock" required>
        </div>
        <div class="col-md-2">
          <input type="number" class="form-control" placeholder="Stock Min" [(ngModel)]="newMaterial.stockMin" name="stockMin" required>
        </div>
        <div class="col-md-2">
          <input type="text" class="form-control" placeholder="Unité (ex: kg)" [(ngModel)]="newMaterial.unit" name="unit" required>
        </div>
        <div class="col-md-3">
          <button type="submit" class="btn btn-success w-100">Enregistrer</button>
        </div>
      </form>
    </div>

    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Désignation</th>
              <th>État du Stock</th>
              <th>Unité</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let m of materials">
              <td>#{{ m.id }}</td>
              <td><strong>{{ m.name }}</strong></td>
              <td>
                <span [class]="m.stock <= m.stockMin ? 'text-danger fw-bold' : 'text-success'">
                  {{ m.stock }}
                </span>
                <small class="text-muted"> / min {{ m.stockMin }}</small>
                <span *ngIf="m.stock <= m.stockMin" class="badge bg-danger ms-2">Alerte</span>
              </td>
              <td>{{ m.unit }}</td>
              <td class="text-end">
                <button class="btn btn-outline-primary btn-sm me-2" (click)="onEdit(m)">Modifier</button>
                <button class="btn btn-outline-danger btn-sm" (click)="onDelete(m.id)">Supprimer</button>
              </td>
            </tr>
            <tr *ngIf="materials.length === 0">
              <td colspan="5" class="text-center py-4 text-muted">Aucune donnée disponible.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
