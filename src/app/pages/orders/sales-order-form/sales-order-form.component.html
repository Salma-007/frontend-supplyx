<div class="container mt-4">
  <div class="form-card">
    <div class="form-header">
      <h2>
        <i class="fas fa-shopping-cart me-2"></i>
        {{ isEditMode ? 'Modifier la Commande' : 'Nouvelle Commande Client' }}
      </h2>
    </div>

    <div class="alert alert-danger" *ngIf="errorMessage">
      <i class="fas fa-exclamation-triangle me-2"></i> {{ errorMessage }}
    </div>

    <form [formGroup]="orderForm" (ngSubmit)="onSubmit()">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Client</label>
          <select formControlName="customerId" class="form-select" [class.is-invalid]="orderForm.get('customerId')?.invalid && orderForm.get('customerId')?.touched">
            <option [ngValue]="null">-- Choisir un client --</option>
            <option *ngFor="let c of customers" [ngValue]="c.id">{{ c.name }} ({{ c.city }})</option>
          </select>
          <div class="invalid-feedback">Le client est requis.</div>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Produit Fini</label>
          <select formControlName="productId" class="form-select" [class.is-invalid]="orderForm.get('productId')?.invalid && orderForm.get('productId')?.touched">
            <option [ngValue]="null">-- Choisir un produit --</option>
            <option *ngFor="let p of products" [ngValue]="p.id">{{ p.name }} - Stock: {{ p.stock }}</option>
          </select>
          <div class="invalid-feedback">Le produit est requis.</div>
        </div>

        <div class="col-md-4 mb-4">
          <label class="form-label">Quantité commandée</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-sort-numeric-up"></i></span>
            <input type="number" formControlName="quantity" class="form-control" min="1" [class.is-invalid]="orderForm.get('quantity')?.invalid && orderForm.get('quantity')?.touched">
          </div>
          <div class="invalid-feedback">Minimum 1 unité.</div>
        </div>
      </div>

      <div class="form-actions border-top pt-3">
        <button type="button" class="btn btn-secondary me-2" routerLink="/sales-orders">
          <i class="fas fa-times me-2"></i> Annuler
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="orderForm.invalid || loading">
          <i class="fas" [ngClass]="loading ? 'fa-spinner fa-spin' : 'fa-check-circle'"></i>
          {{ isEditMode ? 'Mettre à jour' : 'Enregistrer la commande' }}
        </button>
      </div>
    </form>
  </div>
</div>
