<div class="container py-4">
  <div class="mb-3">
    <button class="btn btn-link text-muted p-0 text-decoration-none" routerLink="/products">
      <i class="fas fa-arrow-left me-2"></i>Retour à la liste
    </button>
  </div>

  <div class="card shadow-lg border-0">
    <div class="card-header border-bottom border-primary p-4">
      <h3 class="mb-0 text-white">
        <i class="fas fa-box-open me-2 text-primary"></i>
        {{ isEditMode ? 'Modifier le Produit' : 'Nouveau Produit' }}
      </h3>
    </div>

    <div class="card-body p-4 text-white">
      <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label text-muted">Nom du produit</label>
            <input type="text" formControlName="name" class="form-control">
          </div>
          <div class="col-md-2">
            <label class="form-label text-muted">Coût (€)</label>
            <input type="number" formControlName="cost" class="form-control">
          </div>
          <div class="col-md-2">
            <label class="form-label text-muted">Temps (min)</label>
            <input type="number" formControlName="productionTime" class="form-control">
          </div>
          <div class="col-md-2">
            <label class="form-label text-muted">Stock</label>
            <input type="number" formControlName="stock" class="form-control">
          </div>

          <hr class="my-4 border-secondary">

          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0 text-primary">Composition (Matières Premières)</h5>
            <button type="button" class="btn btn-outline-primary btn-sm" (click)="addBill()">
              <i class="fas fa-plus me-1"></i> Ajouter une matière
            </button>
          </div>

          <div formArrayName="bills">
            <div *ngFor="let bill of bills.controls; let i=index" [formGroupName]="i"
                 class="row g-2 mb-2 align-items-end animate-fade-in">
              <div class="col-md-7">
                <select formControlName="rawMaterialId" class="form-select">
                  <option value="" disabled>Choisir la matière...</option>
                  <option *ngFor="let rm of rawMaterials" [value]="rm.id">{{ rm.name }}</option>
                </select>
              </div>
              <div class="col-md-3">
                <input type="number" formControlName="quantity" class="form-control" placeholder="Qté">
              </div>
              <div class="col-md-2 text-end">
                <button type="button" class="btn btn-outline-danger w-100" (click)="removeBill(i)">
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </div>
          </div>

          <div class="col-12 mt-5">
            <button type="submit" class="btn btn-login w-100 py-3 fw-bold" [disabled]="productForm.invalid">
              <i class="fas fa-save me-2"></i>
              {{ isEditMode ? 'METTRE À JOUR' : 'ENREGISTRER LE PRODUIT' }}
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
