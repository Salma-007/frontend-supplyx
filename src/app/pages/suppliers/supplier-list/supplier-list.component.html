<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Gestion des Fournisseurs</h2>
    <button class="btn btn-primary" (click)="navigateToCreate()">
      <i class="fas fa-plus"></i> Nouveau Fournisseur
    </button>
  </div>

  <!-- Barre de recherche -->


  <!-- Message d'erreur -->
  <div class="alert alert-danger" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <!-- Indicateur de chargement -->
  <div class="text-center" *ngIf="loading">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Chargement...</span>
    </div>
  </div>

  <!-- Tableau des fournisseurs -->
  <div class="card" *ngIf="!loading">
    <div class="card-body">
      <table class="table table-hover">
        <thead>
        <tr>
          <th>ID</th>
          <th>Nom</th>
          <th>Contact</th>
          <th>Note</th>
          <th>Délai (jours)</th>
          <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let supplier of suppliers">
          <td>{{ supplier.id }}</td>
          <td>{{ supplier.name }}</td>
          <td>{{ supplier.contact }}</td>
          <td>
              <span class="badge bg-warning">
                {{ supplier.rating }}/5 ⭐
              </span>
          </td>
          <td>{{ supplier.leadTime }} jours</td>
          <td>
            <button
              class="btn btn-sm btn-info me-2"
              (click)="navigateToDetail(supplier.id)"
              title="Voir détails">
              <i class="fas fa-eye">detail</i>
            </button>
            <button
              class="btn btn-sm btn-warning me-2"
              (click)="navigateToEdit(supplier.id)"
              title="Modifier">
              <i class="fas fa-edit">modifier</i>
            </button>
            <button
              class="btn btn-sm btn-danger"
              (click)="deleteSupplier(supplier.id)"
              title="Supprimer">
              <i class="fas fa-trash">supprimer</i>
            </button>
          </td>
        </tr>
        </tbody>
      </table>

      <div class="alert alert-info" *ngIf="suppliers.length === 0 && !loading">
        Aucun fournisseur trouvé.
      </div>
    </div>
  </div>
</div>
