<div class="dashboard-container">
  <header class="main-header">
    <div class="header-content">
      <div class="brand-section">
        <span class="app-badge">SupplyChain OS</span>
        <h1 class="main-title">Vue d'ensemble</h1>
      </div>
      <div class="header-actions">


      </div>
    </div>
  </header>

  <main class="dashboard-body">

    <section class="stats-grid">
      <div *ngFor="let card of kpiCards" class="kpi-card" (click)="navigateTo(card.route)">
        <div class="kpi-icon-box" [style.background]="card.gradient">
          <i class="fas" [ngClass]="'fa-' + card.icon"></i>
        </div>
        <div class="kpi-data">
          <span class="kpi-label">{{ card.title }}</span>
          <h2 class="kpi-value">{{ card.value }}</h2>
        </div>
        <div class="kpi-decoration" *ngIf="card.showAlert">!</div>
      </div>
    </section>

    <div class="dashboard-layout-bottom">
      <section class="glass-panel flux-card" *ngIf="stats">
        <ng-container *ngIf="(stats.ordersEnAttente + stats.ordersEnCours + stats.ordersRecues) as total">

          <div class="panel-header">
            <h3><i class="fas fa-route"></i> Flux Approvisionnement</h3>
            <span class="total-badge">{{ total }} flux actifs</span>
          </div>

          <div class="flux-items-container">
            <div class="flux-row">
              <div class="flux-label-group">
                <span class="label">En attente</span>
                <span class="count">{{ stats.ordersEnAttente }}</span>
              </div>
              <div class="progress-container">
                <div class="progress-fill warn"
                     [style.width.%]="total > 0 ? (stats.ordersEnAttente / total * 100) : 0">
                </div>
              </div>
            </div>

            <div class="flux-row">
              <div class="flux-label-group">
                <span class="label">En transit</span>
                <span class="count">{{ stats.ordersEnCours }}</span>
              </div>
              <div class="progress-container">
                <div class="progress-fill info"
                     [style.width.%]="total > 0 ? (stats.ordersEnCours / total * 100) : 0">
                </div>
              </div>
            </div>

            <div class="flux-row">
              <div class="flux-label-group">
                <span class="label">Réceptionné</span>
                <span class="count">{{ stats.ordersRecues }}</span>
              </div>
              <div class="progress-container">
                <div class="progress-fill success"
                     [style.width.%]="total > 0 ? (stats.ordersRecues / total * 100) : 0">
                </div>
              </div>
            </div>
          </div>

        </ng-container>
      </section>

      <section class="glass-panel actions-card">
        <div class="panel-header">
          <h3><i class="fas fa-bolt"></i> Actions Rapides</h3>
        </div>
        <div class="action-grid">
          <button class="action-tile p-blue" (click)="navigateTo('/sales-orders/new')">
            <i class="fas fa-plus-circle"></i>
            <span>Nouvelle Vente</span>
          </button>
          <button class="action-tile p-purple" (click)="navigateTo('/materials')">
            <i class="fas fa-shopping-cart"></i>
            <span>Nouvel Raw Material</span>
          </button>
          <button class="action-tile p-light" (click)="navigateTo('/customers/new')">
            <i class="fas fa-user-plus"></i>
            <span>Nouveau Client</span>
          </button>
        </div>
      </section>
    </div>
  </main>
</div>
